<!doctype html>
<html lang="zh-CN">
  <head>
    <script src="static-demo.js"></script>
    <meta charset="utf-8" />
    <!-- 告诉浏览器：页面宽度跟随设备宽度，避免移动端被缩放。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 显示在浏览器标签页上的标题。 -->
    <title>智慧工务管理系统</title>
    <link rel="stylesheet" href="styles/auth.css" />
  </head>
  <body>
    <!-- ===== 页面可见内容从这里开始 ===== -->
    <div class="page">
      <!-- 顶部品牌栏：只用于展示系统名称和定位词。 -->
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">Y</span><span>智慧工务管理系统</span>
        </div>
        <nav class="nav">
          <span>标准化</span><span>数字化</span><span>可追溯</span
          ><span>可决策</span>
        </nav>
      </header>
      <!-- 主区域：id="stage" 会被 JavaScript 用来切换背景。 -->
      <main class="stage" id="stage">
        <!-- 账号相关页面共用同一张卡片；一次只显示一个 .view。 -->
        <section class="card">
          <!-- 找回密码第 1 步：验证手机号码与验证码。 -->
          <section class="view active">
            <h1 class="title"><span class="mark">Y</span>忘记密码</h1>
            <div class="system-name">智慧工务管理系统</div>
            <p class="step-tip">验证您的手机号码后重置密码</p>
            <label for="recoverPhone">手机号</label
            ><input
              id="recoverPhone"
              inputmode="numeric"
              maxlength="13"
              placeholder="请输入手机号"
            /><label>短信验证码</label>
            <div class="code-row">
              <div class="digits" id="recoverDigits">
                <input inputmode="numeric" maxlength="1" /><input
                  inputmode="numeric"
                  maxlength="1"
                /><input inputmode="numeric" maxlength="1" /><input
                  inputmode="numeric"
                  maxlength="1"
                />
              </div>
              <button
                class="code-btn"
                id="recoverCodeButton"
                type="button"
                disabled
              >
                获取验证码
              </button>
            </div>
            <button
              class="primary"
              id="nextButton"
              type="button"
              disabled
              style="margin-top: 28px"
            >
              下一步
            </button>
            <p class="message" id="recoverMessage"></p>
            <p class="bottom-link"><a href="index.html">返回登录</a></p>
          </section>
        </section>
        <!-- 背景图库：点击缩略图会把对应图片设为主展示区背景。 -->
        <div class="gallery" aria-label="背景图切换">
          <div class="gallery-head">
            <span>当前页</span
            ><span>图库 · <small id="bgCountdown">30s</small></span>
          </div>
          <div class="preview-stack" id="previewStack">
            <button
              class="thumb is-active"
              data-image="网页素材/login-coast.png"
              type="button"
            >
              <img src="网页素材/login-coast.png" alt="滨海背景" /></button
            ><button
              class="thumb"
              data-image="网页素材/login-campus.png"
              type="button"
            >
              <img src="网页素材/login-campus.png" alt="园区背景" /></button
            ><button
              class="thumb"
              data-image="网页素材/login-office.png"
              type="button"
            >
              <img src="网页素材/login-office.png" alt="办公背景" />
            </button>
          </div>
        </div>
      </main>
      <!-- 页脚：展示系统归属和联系方式。 -->
      <footer class="footer">
        <span>技术支持：智慧工务管理系统</span
        ><span>服务热线：400-000-0000</span><span>© 2026 版权所有</span>
      </footer>
    </div>
    <!-- 复用弹窗：初始隐藏，由 openDialog 函数打开。 -->
    <div class="dialog" id="dialog">
      <section class="dialog-panel">
        <h2 class="dialog-title" id="dialogTitle">提示</h2>
        <div class="dialog-content" id="dialogContent"></div>
        <p class="dialog-tip" id="dialogTip" hidden></p>
        <div class="dialog-actions" id="dialogActions"></div>
      </section>
    </div>

    <script src="scripts/auth-common.js"></script>
    <script src="scripts/forgot-password.js"></script>
  </body>
</html>
